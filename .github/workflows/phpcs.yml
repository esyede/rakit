---
name: phpcs
on:
    - push
    - pull_request

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@v4
            - name: setup php
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "7.2"
                  extensions: mbstring, simplexml, dom, openssl, curl, gd
            - name: get composer cache directory
              id: composer-cache
              run: echo "directory=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"
            - name: cache composer dependencies
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.directory }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: ${{ runner.os }}-composer-
            - name: install dependencies
              run: composer install --no-progress --prefer-dist --optimize-autoloader
            - name: check php version
              run: php -v
            - name: download phpcs
              run: wget -O phpcs.phar https://github.com/PHP-CS-Fixer/PHP-CS-Fixer/releases/latest/download/php-cs-fixer.phar
            - name: make phpcs executable
              run: chmod +x phpcs.phar
            - name: "style: apply coding style"
              run: php phpcs.phar fix
            - name: check for changes
              id: changes
              run: |
                git diff --quiet || echo "changed=true" >> "$GITHUB_OUTPUT"
            - name: commit and push fixes
              if: steps.changes.outputs.changed == 'true'
              run: |
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git add -A
                git commit -m "style: fix coding style [skip ci]"
                git push
            - name: remove phpcs
              run: rm -f phpcs.phar
