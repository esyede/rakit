---
name: phpcs
on:
    push:
        paths:
            - '**/*.php'
            - '.github/workflows/**'
    pull_request:
        paths:
            - '**/*.php'
            - '.github/workflows/**'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@v4
            - name: setup php
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "7.2"
                  extensions: mbstring, simplexml, dom, openssl, curl, gd
            - name: get composer cache directory
              id: composer-cache
              run: echo "directory=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"
            - name: cache composer dependencies
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.directory }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: ${{ runner.os }}-composer-
            - name: install dependencies
              run: composer install --no-progress --prefer-dist --optimize-autoloader
            - name: check php version
              run: php -v
            - name: download phpcs
              run: wget -O phpcs.phar https://cs.symfony.com/download/php-cs-fixer-v2.phar
            - name: make phpcs executable
              run: chmod +x phpcs.phar
            # Note: 'fix' rewrites the files in the runner's checkout and then
            # throws them away, so it reported success no matter what the code
            # looked like. '--dry-run' makes it report instead of rewrite, and
            # php-cs-fixer exits 8 when a file would have changed - which is what
            # turns this job into an actual check.
            - name: "style: check coding style"
              run: php phpcs.phar fix --dry-run --diff --format=txt
            - name: remove phpcs
              if: always()
              run: rm -f phpcs.phar
